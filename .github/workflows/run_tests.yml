name: CMake tests

on:
  push:
    branches: 
      - master
      - devel
  pull_request:
    branches:
      - master
      - devel

env:
  BUILD_TYPE: Debug

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
        matrix:
            os: [windows-2022]
    steps:
    - uses: actions/checkout@v3

    - name: Build dotnet support
      working-directory: ${{github.workspace}}/windows-setup
      run: dotnet build

    - name: Install dependencies
      working-directory: ${{github.workspace}}/windows-setup
      run: dotnet run installdeps ${{env.BUILD_TYPE}}

    - name: Install project VoronoiLatticeDistances
      working-directory: ${{github.workspace}}/windows-setup
      run: dotnet run install ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest --build-config ${{env.BUILD_TYPE}} --build-target install
